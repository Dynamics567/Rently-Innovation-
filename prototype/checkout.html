<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — Rently</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/rently.css" />
<style>
body{padding-top:0;}
.co-bar{border-bottom:1px solid var(--line);padding:20px 0;position:sticky;top:0;background:rgba(250,248,244,.95);backdrop-filter:blur(10px);z-index:100;}
.co-bar-inner{display:flex;align-items:center;justify-content:space-between;gap:24px;}
.co-secure{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-faint);flex-shrink:0;}
.co-secure svg{color:var(--green);}
@media(max-width:800px){.co-bar .stepper{display:none;}}

.co-layout{display:grid;grid-template-columns:1fr 380px;gap:56px;padding:48px 0 120px;align-items:start;}
@media(max-width:980px){.co-layout{grid-template-columns:1fr;}}

.step-panel{display:none;}
.step-panel.active{display:block;animation:fadeUp .4s var(--ease);}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.step-panel h2{font-size:24px;font-weight:400;margin-bottom:8px;}
.step-panel .sub{color:var(--ink-soft);font-size:14px;margin-bottom:28px;}

.summary-strip{display:flex;gap:14px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:16px;margin-bottom:28px;}
.summary-strip .thumb{width:64px;height:64px;border-radius:12px;overflow:hidden;position:relative;flex-shrink:0;}
.summary-strip .thumb .art{position:absolute;inset:0;}
.summary-strip .t{font-size:14px;font-weight:600;}
.summary-strip .s{font-size:12.5px;color:var(--ink-faint);margin-top:3px;}
.summary-strip a{margin-left:auto;flex-shrink:0;}

.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
@media(max-width:560px){.form-2col{grid-template-columns:1fr;}}

.pay-methods{display:flex;flex-direction:column;gap:10px;margin-bottom:24px;}
.pay-method{display:flex;align-items:center;gap:14px;padding:15px 16px;border:1.5px solid var(--line-strong);border-radius:14px;cursor:pointer;transition:.2s;}
.pay-method:hover{border-color:var(--ink-faint);}
.pay-method.sel{border-color:var(--blue);background:var(--blue-soft);}
.pay-method .radio{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.pay-method.sel .radio{border-color:var(--blue);}
.pay-method.sel .radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--blue);}
.pay-method .pm-icon{width:34px;height:34px;border-radius:8px;background:var(--bg-alt);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink-soft);}
.pay-method .pm-name{font-size:13.5px;font-weight:600;}
.pay-method .pm-sub{font-size:11.5px;color:var(--ink-faint);}
.card-fields{display:none;padding:18px;background:var(--bg-alt);border-radius:14px;margin-top:-4px;margin-bottom:24px;}
.card-fields.open{display:block;}

.order-summary{position:sticky;top:100px;border:1px solid var(--line-strong);border-radius:22px;padding:26px;box-shadow:var(--sh-sm);}
.order-summary h4{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:18px;}
.os-listing{display:flex;gap:14px;margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--line);}
.os-listing .thumb{width:64px;height:64px;border-radius:12px;overflow:hidden;position:relative;flex-shrink:0;}
.os-listing .thumb .art{position:absolute;inset:0;}
.os-listing .t{font-size:13.5px;font-weight:600;line-height:1.3;}
.os-listing .s{font-size:12px;color:var(--ink-faint);margin-top:4px;}
.os-row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-soft);margin-bottom:10px;}
.os-row.total{color:var(--ink);font-weight:700;font-size:16px;padding-top:14px;margin-top:6px;border-top:1px solid var(--line);}

.confirm-wrap{text-align:center;padding:40px 20px 10px;max-width:520px;margin:0 auto;}
.confirm-icon{width:76px;height:76px;border-radius:50%;background:var(--green-soft);color:var(--green-dark);display:flex;align-items:center;justify-content:center;margin:0 auto 26px;}
.confirm-wrap h2{font-size:26px;margin-bottom:10px;}
.confirm-wrap .sub{margin-bottom:30px;}
.confirm-ref{display:inline-flex;gap:10px;align-items:center;background:var(--bg-alt);border-radius:999px;padding:10px 20px;font-size:13px;font-weight:600;margin-bottom:34px;}
.confirm-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
</style>
</head>
<body>

<div class="co-bar">
  <div class="container co-bar-inner">
    <a class="wordmark wordmark-sm" href="homepage"><img src="assets/images/logo.png" alt="Rently" /></a>
    <div class="stepper" id="stepper"></div>
    <div class="co-secure" id="coSecure"></div>
  </div>
</div>

<div class="container">
  <div class="co-layout">
    <div>
      <!-- STEP 1: REVIEW -->
      <div class="step-panel active" id="panel-review">
        <h2>Review your booking</h2>
        <p class="sub">Confirm the details below before we verify your account and take payment.</p>
        <div class="summary-strip">
          <div class="thumb" id="revThumb"></div>
          <div>
            <div class="t" id="revTitle"></div>
            <div class="s" id="revDates"></div>
          </div>
          <a class="text-link faint" id="revEditLink">Edit dates</a>
        </div>

        <div class="field"><label>Full name</label><input type="text" id="fName" /></div>
        <div class="form-2col">
          <div class="field"><label>Email address</label><input type="email" id="fEmail" /></div>
          <div class="field"><label>Phone number <span style="color:var(--ink-faint);font-weight:400">(optional)</span></label><input type="tel" id="fPhone" placeholder="+234 803 123 4567" /></div>
        </div>
        <div class="field"><label>Note to provider <span style="color:var(--ink-faint);font-weight:400">(optional)</span></label><textarea id="fNote" placeholder="Anything the provider should know ahead of time?"></textarea></div>
        <div class="check-row" style="margin-bottom:24px;">
          <input type="checkbox" id="agreeTerms" />
          <label for="agreeTerms">I agree to Rently's Terms of Service and the provider's cancellation policy.</label>
        </div>
        <div id="reviewError" class="banner danger" style="display:none;margin-bottom:20px;"></div>
        <button class="pill-btn blue lg block" id="toPayBtn">Continue</button>
      </div>

      <!-- STEP 2: CONFIRM & PAY -->
      <div class="step-panel" id="panel-pay">
        <h2>Confirm &amp; pay</h2>
        <p class="sub">Every payment is held in escrow until your rental period begins.</p>
        <div class="pay-methods" id="payMethods"></div>
        <div class="banner success" id="escrowBanner" style="margin-bottom:24px;"></div>
        <div id="payError" class="banner danger" style="display:none;margin-bottom:20px;"></div>
        <button class="pill-btn blue lg block" id="payBtn">Pay</button>
      </div>

      <!-- STEP 4: CONFIRMATION -->
      <div class="step-panel" id="panel-confirm">
        <div class="confirm-wrap">
          <div class="confirm-icon" id="confirmIcon"></div>
          <h2 id="confirmTitle">Booking confirmed</h2>
          <p class="sub" id="confirmSub"></p>
          <div class="confirm-ref"><span style="color:var(--ink-faint)">Reference</span><span id="confirmRef"></span></div>
          <div class="confirm-actions">
            <a class="pill-btn blue" href="dashboard-renter">View my bookings</a>
            <button class="pill-btn ghost" id="confirmMsgBtn" disabled title="Messaging is coming soon.">Message provider</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ORDER SUMMARY (persists across steps 1-3) -->
    <div class="order-summary" id="orderSummary">
      <h4>Order summary</h4>
      <div class="os-listing">
        <div class="thumb" id="osThumb"></div>
        <div><div class="t" id="osTitle"></div><div class="s" id="osDates"></div></div>
      </div>
      <div id="osBreakdown"></div>
    </div>
  </div>
</div>

<script src="assets/rently.js"></script>
<script src="assets/api.js"></script>
<script>
const session = requireSession();
</script>
<script>
const params=new URLSearchParams(window.location.search);
let listing=null, provider=null, quote=null;
const fromISO = params.get('from') || new Date(Date.now()+7*86400000).toISOString();
const toISO = params.get('to') || new Date(Date.now()+9*86400000).toISOString();

document.getElementById('coSecure').innerHTML = icon('lock',{size:13})+'<span>Secure checkout</span>';

/* ---- stepper ---- */
const STEPS=[['review','Review'],['pay','Confirm & pay'],['confirm','Done']];
let stepIdx=0;
function renderStepper(){
  document.getElementById('stepper').innerHTML = STEPS.map(([key,lbl],i)=>{
    const state = i<stepIdx?'done':(i===stepIdx?'active':'');
    const circ = i<stepIdx ? icon('check',{size:12,stroke:3}) : (i+1);
    const line = i<STEPS.length-1 ? `<div class="step-line ${i<stepIdx?'done':''}"></div>` : '';
    return `<div class="step-item ${state}"><div class="circ">${circ}</div><div class="lbl">${lbl}</div></div>${line}`;
  }).join('');
}
function goToStep(i){
  stepIdx=i;
  STEPS.forEach(([k],idx2)=>{ document.getElementById('panel-'+k).classList.toggle('active', idx2===i); });
  renderStepper();
  window.scrollTo({top:0,behavior:'smooth'});
}
renderStepper();

(async function init(){
  if(!session) return; // requireSession() is already redirecting to auth
  const listingId=params.get('id');
  try{
    const categoryById = await getCategoryMapById();
    const {data: apiListing} = await apiFetch(`/listings/${listingId}`,{auth:false});
    listing = await mapListing(apiListing, categoryById);
    provider = await getProviderCached(listing.providerId);
    const {data:q} = await apiFetch(`/listings/${listingId}/quote?from=${fromISO}&to=${toISO}`,{auth:false});
    quote = q;
  }catch(e){
    document.querySelector('.container').innerHTML = `<div style="padding:100px 0;text-align:center;color:var(--ink-faint)">Couldn't load this booking. <a href="browse">Browse listings</a>.</div>`;
    return;
  }

  const dFrom=new Date(fromISO), dTo=new Date(toISO);
  const dateStr = `${dFrom.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${dTo.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;
  const rentalNaira=Math.round(quote.rentalFeeMinor/100), serviceNaira=Math.round(quote.serviceFeeMinor/100), depositNaira=Math.round(quote.depositMinor/100), totalNaira=Math.round(quote.totalMinor/100);

  document.getElementById('revEditLink').href = 'listing?id='+listing.id;
  function paintThumb(el){ el.innerHTML = artDiv(listing.img||listing.cat, 130, .2); }
  ['revThumb','osThumb'].forEach(id=>paintThumb(document.getElementById(id)));
  document.getElementById('revTitle').textContent=listing.title;
  document.getElementById('revDates').textContent=`${dateStr} · ${quote.nights} ${listing.unit}${quote.nights>1?'s':''} · ${provider.name}`;
  document.getElementById('osTitle').textContent=listing.title;
  document.getElementById('osDates').textContent=dateStr;
  document.getElementById('osBreakdown').innerHTML = `
    <div class="os-row"><span>${money(listing.price)} × ${quote.nights} ${listing.unit}${quote.nights>1?'s':''}</span><span>${money(rentalNaira)}</span></div>
    <div class="os-row"><span>Service fee</span><span>${money(serviceNaira)}</span></div>
    <div class="os-row"><span>Refundable deposit</span><span>${money(depositNaira)}</span></div>
    <div class="os-row total"><span>Total</span><span>${money(totalNaira)}</span></div>`;

  document.getElementById('fName').value = session.user.fullName || '';
  document.getElementById('fEmail').value = session.user.email || '';

  /* ---- STEP 1 -> 2 ---- */
  document.getElementById('toPayBtn').addEventListener('click',()=>{
    const errEl=document.getElementById('reviewError');
    errEl.style.display='none';
    if(!document.getElementById('fName').value.trim() || !document.getElementById('fEmail').value.trim()){
      errEl.innerHTML=icon('alert',{size:15})+'<div>Please fill in your name and email.</div>'; errEl.style.display='flex'; return;
    }
    if(!document.getElementById('agreeTerms').checked){
      errEl.innerHTML=icon('alert',{size:15})+'<div>Please agree to the Terms of Service to continue.</div>'; errEl.style.display='flex'; return;
    }
    goToStep(1);
  });

  /* ---- STEP 2: confirm & pay ---- */
  const PAY_METHODS=[
    {key:'card',name:'Debit / Credit Card',sub:'Visa, Mastercard, Verve',icon:'card'},
    {key:'transfer',name:'Bank Transfer',sub:'Instant confirmation via Paystack',icon:'wallet'},
    {key:'ussd',name:'USSD',sub:'Pay from any phone, no app needed',icon:'phone'},
  ];
  let selectedPay='card';
  function renderPayMethods(){
    document.getElementById('payMethods').innerHTML = PAY_METHODS.map(m=>`
      <div class="pay-method ${selectedPay===m.key?'sel':''}" data-key="${m.key}">
        <div class="radio"></div>
        <div class="pm-icon">${icon(m.icon,{size:16})}</div>
        <div><div class="pm-name">${m.name}</div><div class="pm-sub">${m.sub}</div></div>
      </div>`).join('');
    document.querySelectorAll('.pay-method').forEach(el=>el.addEventListener('click',()=>{ selectedPay=el.dataset.key; renderPayMethods(); }));
  }
  renderPayMethods();
  document.getElementById('escrowBanner').innerHTML = icon('shield',{size:16})+`<div><div class="t">Your ${money(totalNaira)} is protected</div><div class="d">Funds are held in escrow and only released to ${provider.name} once your rental period begins. If something's wrong, you have recourse.</div></div>`;
  document.getElementById('payBtn').textContent = listing.mode==='instant' ? `Pay ${money(totalNaira)} securely` : `Request to Book · ${money(totalNaira)} held`;

  const idempotencyKey = crypto.randomUUID();
  document.getElementById('payBtn').addEventListener('click', async ()=>{
    const btn=document.getElementById('payBtn');
    const errEl=document.getElementById('payError'); errEl.style.display='none';
    btn.disabled=true; const original=btn.textContent; btn.textContent='Processing…';
    try{
      const {data: booking} = await apiFetch('/bookings',{method:'POST',idempotencyKey,body:{listingId:listing.id, from:fromISO, to:toISO}});
      goToStep(2);
      const instant = booking.stage==='reserved';
      document.getElementById('confirmIcon').innerHTML = icon(instant?'check':'clock',{size:30,stroke:2.4});
      document.getElementById('confirmTitle').textContent = instant ? 'Booking confirmed' : 'Request sent to '+provider.name;
      document.getElementById('confirmSub').textContent = instant
        ? `Your payment is held in escrow and ${provider.name} has been notified. You'll get the exact address and pickup details by email.`
        : `Your card won't be charged unless ${provider.name} approves — we'll notify you the moment they respond.`;
      document.getElementById('confirmRef').textContent = 'RNT-'+booking.id.slice(0,8).toUpperCase();
    }catch(e){
      errEl.innerHTML=icon('alert',{size:15})+`<div>${apiErrorMessage(e)}</div>`; errEl.style.display='flex';
      btn.disabled=false; btn.textContent=original;
    }
  });

  initReveal();
})();
</script>
</body>
</html>
